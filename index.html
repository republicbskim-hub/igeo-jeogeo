  /* 레이아웃: 16:9 게임 캔버스 하나를 화면 중앙에, 터치 기기에서만 보조 버튼 */
  :root {
    --bg: #0b0d14;
    --bezel: #1b1f2c;
    --bezel-line: #2c3246;
    --fg: #e8eaf0;
    --dim: #8a93aa;

    --font-kr: "Do Hyeon", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-kr);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;

(function () {
  'use strict';
  const OFG = (window.OFG = window.OFG || {});

  // 픽셀아트 내부 해상도 (nearest-neighbor 확대)
  OFG.W = 320;
  OFG.H = 180;
  // 텍스트/UI 레이어 논리 해상도 (한글 가독성 우선)
  OFG.HW = 1280;
  OFG.HH = 720;
  OFG.S = OFG.HW / OFG.W; // 4

  OFG.FONT_KR = '"Do Hyeon", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
  OFG.FONT_PX = '"Press Start 2P", "Consolas", "Courier New", monospace';

  // 행사용 모드 설정
  OFG.MODES = [
    { id: 'life3', label: '3 LIFE', desc: '세 번 틀리면 끝', life: 3 },
    { id: 'miss1', label: '1 MISS', desc: '한 번 틀리면 바로 끝', life: 1 },
    { id: 'practice', label: '무한 연습', desc: '틀려도 끝까지', life: Infinity },
  ];

  // 캐릭터 배치 (픽셀 좌표, 발 기준)
  OFG.EXEC_X = 76;
  OFG.EMP_X = 244;
  OFG.FLOOR_Y = 160;

  OFG.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  OFG.lerp = (a, b, t) => a + (b - a) * t;

  // 재현 가능한 난수 (테스트용 시드 지원)
  OFG.makeRng = function (seed) {
    if (seed === undefined || seed === null) return Math.random;
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
})();

<script>
/* src/data/commands.js */

    c(301, 3, '이거 해, 저거 하지 마!', T, F),
    c(302, 3, '저거 해, 이거 하지 마!', F, T),
    c(303, 3, '이거 하지 말고 저거 해!', F, T),

    c(504, 5, '저거 하지 말고 이거 할까 말까?', F, F),

<script>
/* src/game/commandManager.js */
/*
 * CommandManager — 명령 선택 / 난이도 관리 / 제한시간 관리 / 정답 상태 제공.
 * 자연어 분석은 절대 하지 않는다.
 */
(function () {
  'use strict';
  const OFG = window.OFG;

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  // 풀에서 count개를 뽑는다. 같은 문장이 연달아 나오지 않게 한다.
  function pickFromPool(pool, count, rng, prevText) {
    const out = [];
    let bag = [];
    while (out.length < count) {
      if (!bag.length) bag = shuffle(pool.slice(), rng);
      const last = out.length ? out[out.length - 1].text : prevText;
      let idx = bag.findIndex((cmd) => cmd.text !== last);
      if (idx < 0) idx = 0;
      out.push(bag.splice(idx, 1)[0]);
    }
    return out;
  }

  class CommandManager {
    constructor(opts) {
      opts = opts || {};
      this.rng = opts.rng || Math.random;
      this.commands = opts.commands || OFG.COMMANDS;
      this.plan = opts.plan || OFG.STAGE_PLAN;
      this.sequence = [];
      this.index = -1;
    }

    build() {
      const seq = [];
      let prev = null;
      this.plan.forEach((stage, si) => {
        const pool = this.commands.filter((cmd) => cmd.difficulty === stage.difficulty);
        const picks = pickFromPool(pool, stage.count, this.rng, prev);
        picks.forEach((cmd, i) => {
          seq.push({
            cmd,
            stageIndex: si,
            stage,
            indexInStage: i,
            number: seq.length + 1,
            timeLimit: CommandManager.timeLimitFor(cmd, stage, i),
          });
          prev = cmd.text;
        });
      });
      this.sequence = seq;
      this.index = -1;
      return seq;
    }

    next() {
      this.index++;
      return this.sequence[this.index] || null;
    }

    get total() {
      return this.sequence.length;
    }

    // 명령 데이터에 timeLimit이 있으면 우선, 없으면 스테이지 진행에 따라 선형 감소.
    // 긴 문장은 조금 더 준다.
    static timeLimitFor(cmd, stage, i) {
      if (cmd.timeLimit) return cmd.timeLimit;
      const t = stage.count > 1 ? i / (stage.count - 1) : 0;
      const base = stage.timeStart + (stage.timeEnd - stage.timeStart) * t;
      const extra = Math.max(0, cmd.text.length - 14) * 10;
      return Math.round(base + extra);
    }

    // null = 현재(문제 시작 시점) 상태 유지
    static getTargetState(command, currentState) {
      return {
        thisState: command.targetThis === null ? currentState.thisState : command.targetThis,
        thatState: command.targetThat === null ? currentState.thatState : command.targetThat,
      };
    }

    static isCorrect(state, target) {
      return state.thisState === target.thisState && state.thatState === target.thatState;
    }
  }

  CommandManager.shuffle = shuffle;
  OFG.CommandManager = CommandManager;
})();

</script>
<script>
/* src/game/scoreManager.js */
/* 점수 / 콤보 / 라이프 */
(function () {
  'use strict';
  const OFG = window.OFG;

  class ScoreManager {
    constructor(maxLife) {
      this.reset(maxLife);
    }

    reset(maxLife) {
      this.maxLife = maxLife === undefined ? 3 : maxLife;
      this.life = this.maxLife;
      this.score = 0;
      this.combo = 0;
      this.maxCombo = 0;
      this.correct = 0;
      this.answered = 0;
    }

    // 기본 100 + 남은 시간(초) × 50 + 콤보 × 10
    correctAnswer(remainingSec) {
      this.answered++;
      this.correct++;
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      const gained = 100 + Math.round(Math.max(0, remainingSec) * 50) + this.combo * 10;
      this.score += gained;
      return gained;
    }

    miss() {
      this.answered++;
      this.combo = 0;
      if (Number.isFinite(this.life)) this.life = Math.max(0, this.life - 1);
      return this.life;
    }

    get isDead() {
      return this.life <= 0;
    }

    get infinite() {
      return !Number.isFinite(this.maxLife);
    }

    // 업무 지시 이해도 (%)
    get accuracy() {
      return this.answered ? Math.round((this.correct / this.answered) * 100) : 0;
    }
  }

  OFG.ScoreManager = ScoreManager;
})();

</script>
<script>
/* src/game/inputManager.js */
/*
 * 입력 — 방향키만으로 플레이.
 *   ← 이거 토글   → 저거 토글   ↑ 둘 다 UP   ↓ 둘 다 DOWN
 */
(function () {
  'use strict';
  const OFG = window.OFG;

  const KEYMAP = {
    ArrowLeft: 'left',
    ArrowRight: 'right',
    ArrowUp: 'up',
    ArrowDown: 'down',
    Left: 'left',
    Right: 'right',
    Up: 'up',
    Down: 'down',
    Enter: 'enter',
    NumpadEnter: 'enter',
    Escape: 'escape',
    Esc: 'escape',
    KeyM: 'mute',
    m: 'mute',
    M: 'mute',
  };
  const ARROWS = { left: 1, right: 1, up: 1, down: 1 };

  // 순수 함수: 상태 + 입력 → 새 상태
  OFG.applyStateAction = function (state, action) {
    switch (action) {
      case 'left':
        return { thisState: !state.thisState, thatState: state.thatState };
      case 'right':
        return { thisState: state.thisState, thatState: !state.thatState };
      case 'up':
        return { thisState: true, thatState: true };
      case 'down':
        return { thisState: false, thatState: false };
      default:
        return { thisState: state.thisState, thatState: state.thatState };
    }
  };

  class InputManager {
    constructor(onAction) {
      this.onAction = onAction;
      this._onKey = this._onKey.bind(this);
    }

    attach() {
      window.addEventListener('keydown', this._onKey, { passive: false });
    }

    _onKey(e) {
      const action = KEYMAP[e.code] || KEYMAP[e.key];
      if (!action) return;
      if (ARROWS[action] || action === 'enter') e.preventDefault();
      // 키를 누르고 있어도 한 번만 토글 (반응성/오입력 방지)
      if (e.repeat) return;
      this.onAction(action);
    }

    // 터치 기기용 보조 버튼
    bindButtons(root) {
      if (!root) return;
      root.querySelectorAll('[data-action]').forEach((btn) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.onAction(btn.getAttribute('data-action'));
        });
      });
    }
  }

  OFG.InputManager = InputManager;
})();

</script>
<script>
/* src/game/audio.js */
/*
 * 8bit 사운드 — 파일 없이 WebAudio로 합성.
 * 효과음: command / toggle / correct / wrong / combo / gameover / clear
 * BGM: 코믹한 사무실 칩튠, 스테이지마다 BPM 상승
 */
(function () {
  'use strict';
  const OFG = window.OFG;

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // 8마디 루프. 0 = 쉼표. 8분음표 단위.
  const LEAD = [
    [76, 0, 79, 76, 72, 0, 74, 76],
    [72, 0, 69, 72, 76, 0, 74, 72],
    [69, 72, 77, 0, 76, 74, 72, 69],
    [71, 0, 74, 0, 79, 77, 76, 74],
    [76, 79, 84, 0, 79, 76, 0, 72],
    [69, 72, 76, 0, 81, 79, 76, 72],
    [74, 77, 81, 77, 79, 71, 74, 77],
    [76, 0, 72, 0, 67, 0, 72, 0],
  ];
  const BASS_ROOT = [48, 45, 41, 43, 48, 45, 50, 48];
  const BASS_ROOT_B = [null, null, null, null, null, null, 43, null]; // 7마디 후반 G

  class AudioManager {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.bgmOn = false;
      this.bpm = 112;
      this.step = 0;
      this.nextTime = 0;
      this.timer = null;
    }

    ensure() {
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          const ctx = (this.ctx = new AC());
          this.master = ctx.createGain();
          this.master.gain.value = this.muted ? 0 : 0.55;
          this.master.connect(ctx.destination);
          this.sfxGain = ctx.createGain();
          this.sfxGain.gain.value = 0.9;
          this.sfxGain.connect(this.master);
          this.bgmGain = ctx.createGain();
          this.bgmGain.gain.value = 0.2;
          this.bgmGain.connect(this.master);
          this.pulse25 = this._pulseWave(0.25);
          this.pulse12 = this._pulseWave(0.125);
          const len = ctx.sampleRate;
          this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = this.noise.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return true;
      } catch (e) {
        return false;
      }
    }

    _pulseWave(duty) {
      const n = 32;
      const real = new Float32Array(n);
      const imag = new Float32Array(n);
      for (let i = 1; i < n; i++) real[i] = (2 * Math.sin(i * Math.PI * duty)) / (i * Math.PI);
      return this.ctx.createPeriodicWave(real, imag);
    }

    toggleMute() {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.55;
      return this.muted;
    }

    _tone(wave, freq, t, dur, vol, dest, slideTo) {
      const ctx = this.ctx;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      if (typeof wave === 'string') o.type = wave;
      else o.setPeriodicWave(wave);
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(dest || this.sfxGain);
      o.start(t);
      o.stop(t + dur + 0.02);
    }

    _noiseHit(t, dur, vol, hp, dest) {
      const ctx = this.ctx;
      const s = ctx.createBufferSource();
      s.buffer = this.noise;
      const f = ctx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = hp;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f);
      f.connect(g);
      g.connect(dest || this.sfxGain);
      s.start(t, Math.random() * 0.5);
      s.stop(t + dur + 0.02);
    }

    sfx(name) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + 0.001;
      const P = this.pulse25;
      switch (name) {
        case 'toggleUp':
          this._tone(this.pulse12, 700, t, 0.06, 0.22, null, 1150);
          break;
        case 'toggleDown':
          this._tone(this.pulse12, 620, t, 0.06, 0.22, null, 360);
          break;
        case 'blip':
          this._tone(P, 190 + Math.random() * 110, t, 0.035, 0.1);
          break;
        case 'command':
          this._tone(P, 523, t, 0.05, 0.14);
          this._tone(P, 784, t + 0.05, 0.06, 0.14);
          break;
        case 'correct': // 띵!
          this._tone('triangle', 1568, t, 0.09, 0.35);
          this._tone('sine', 2093, t + 0.07, 0.35, 0.3);
          this._tone('sine', 3136, t + 0.07, 0.2, 0.06);
          break;
        case 'wrong':
          this._tone('sawtooth', 220, t, 0.28, 0.2, null, 90);
          this._tone(P, 233, t, 0.28, 0.12, null, 95);
          this._noiseHit(t, 0.12, 0.12, 800);
          break;
        case 'combo':
          [1047, 1319, 1568, 2093].forEach((f, i) => this._tone(P, f, t + i * 0.045, 0.07, 0.16));
          break;
        case 'perfect':
          [784, 988, 1175, 1568, 1976].forEach((f, i) => this._tone(P, f, t + i * 0.06, 0.1, 0.18));
          break;
        case 'stage':
          this._tone(P, 659, t, 0.08, 0.18);
          this._tone(P, 988, t + 0.09, 0.14, 0.18);
          break;
        case 'start':
          this._tone(P, 988, t, 0.07, 0.2);
          this._tone(P, 1319, t + 0.07, 0.2, 0.2);
          break;
        case 'select':
          this._tone(P, 880, t, 0.04, 0.12);
          break;
        case 'gameover':
          [392, 330, 262].forEach((f, i) => this._tone(P, f, t + i * 0.22, 0.2, 0.2));
          this._tone('triangle', 131, t + 0.66, 0.9, 0.3, null, 98);
          break;
        case 'clear':
          [523, 659, 784, 1047].forEach((f, i) => this._tone(P, f, t + i * 0.1, 0.1, 0.2));
          [523, 659, 784, 1047].forEach((f) => this._tone('triangle', f, t + 0.42, 0.8, 0.12));
          this._tone(P, 1568, t + 0.42, 0.8, 0.14);
          break;
        default:
          break;
      }
    }

    setBpm(bpm) {
      this.bpm = bpm;
    }

    startBgm() {
      if (!this.ctx) return;
      this.stopBgm();
      this.bgmOn = true;
      this.step = 0;
      this.nextTime = this.ctx.currentTime + 0.08;
      this.timer = setInterval(() => this._schedule(), 25);
    }

    stopBgm() {
      this.bgmOn = false;
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
    }

    _schedule() {
      if (!this.ctx || !this.bgmOn) return;
      const ahead = this.ctx.currentTime + 0.12;
      // 탭이 비활성이라 밀렸으면 건너뛴다
      if (this.nextTime < this.ctx.currentTime - 0.2) this.nextTime = this.ctx.currentTime + 0.02;
      while (this.nextTime < ahead) {
        this._playStep(this.step, this.nextTime);
        this.nextTime += 60 / this.bpm / 2;
        this.step = (this.step + 1) % 64;
      }
    }

    _playStep(s, t) {
      if (this.muted) return;
      const bar = Math.floor(s / 8);
      const i = s % 8;
      const eighth = 60 / this.bpm / 2;
      const note = LEAD[bar][i];
      if (note) this._tone(this.pulse25, mtof(note), t, eighth * 0.8, 0.32, this.bgmGain);
      let root = BASS_ROOT[bar];
      if (i >= 4 && BASS_ROOT_B[bar]) root = BASS_ROOT_B[bar];
      this._tone('triangle', mtof(root + (i % 2 ? 12 : 0)), t, eighth * 0.9, 0.55, this.bgmGain);
      if (i % 4 === 0) this._tone('sine', 150, t, 0.12, 0.6, this.bgmGain, 45);
      if (i % 4 === 2) this._noiseHit(t, 0.08, 0.25, 1800, this.bgmGain);
      this._noiseHit(t, 0.025, 0.12, 7000, this.bgmGain);
    }
  }

  OFG.AudioManager = AudioManager;
})();

</script>
<script>
/* src/render/pixel.js */
/* 픽셀아트 드로잉 헬퍼 */
(function () {
  'use strict';
  const OFG = window.OFG;

  function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  const px = {
    rect(p, x, y, w, h, c) {
      p.fillStyle = c;
      p.fillRect(Math.round(x), Math.round(y), w, h);
    },
    dot(p, x, y, c) {
      p.fillStyle = c;
      p.fillRect(Math.round(x), Math.round(y), 1, 1);
    },
    // 두께 있는 직선 (정사각형 스탬프)
    line(p, x0, y0, x1, y1, thick, c) {
      p.fillStyle = c;
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
      const o = Math.floor(thick / 2);
      for (let i = 0; i <= n; i++) {
        const x = Math.round(x0 + ((x1 - x0) * i) / n);
        const y = Math.round(y0 + ((y1 - y0) * i) / n);
        p.fillRect(x - o, y - o, thick, thick);
      }
    },
    circle(p, cx, cy, r, c) {
      p.fillStyle = c;
      for (let dy = -r; dy <= r; dy++) {
        const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8));
        p.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
      }
    },
  };

  /*
   * 캐릭터용 버퍼. 원점(발 위치) 기준 좌표로 그린 뒤
   * 불투명 픽셀 주위에 1px 외곽선을 자동으로 두른다.
   */
  class SpriteBuf {
    constructor(w, h, ox, oy) {
      this.w = w;
      this.h = h;
      this.ox = ox;
      this.oy = oy;
      this.canvas = document.createElement('canvas');
      this.canvas.width = w;
      this.canvas.height = h;
      this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    }
    clear() {
      this.ctx.clearRect(0, 0, this.w, this.h);
    }
    r(x, y, w, h, c) {
      this.ctx.fillStyle = c;
      this.ctx.fillRect(Math.round(x + this.ox), Math.round(y + this.oy), w, h);
    }
    d(x, y, c) {
      this.r(x, y, 1, 1, c);
    }
    line(x0, y0, x1, y1, thick, c) {
      px.line(this.ctx, x0 + this.ox, y0 + this.oy, x1 + this.ox, y1 + this.oy, thick, c);
    }
    outline(hex) {
      const { w, h } = this;
      const img = this.ctx.getImageData(0, 0, w, h);
      const d = img.data;
      const out = new Uint8ClampedArray(d);
      const [r, g, b] = hexToRgb(hex);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          if (d[i + 3] !== 0) continue;
          const solid =
            (x > 0 && d[i - 4 + 3] > 200) ||
            (x < w - 1 && d[i + 4 + 3] > 200) ||
            (y > 0 && d[i - w * 4 + 3] > 200) ||
            (y < h - 1 && d[i + w * 4 + 3] > 200);
          if (solid) {
            out[i] = r;
            out[i + 1] = g;
            out[i + 2] = b;
            out[i + 3] = 255;
          }
        }
      }
      this.ctx.putImageData(new ImageData(out, w, h), 0, 0);
    }
    blit(p, x, y) {
      p.drawImage(this.canvas, Math.round(x - this.ox), Math.round(y - this.oy));
    }
  }

  OFG.px = px;
  OFG.SpriteBuf = SpriteBuf;
  OFG.OUTLINE = '#1a1c26';
})();

</script>
